name: Build and publish Urbaniac (Windows)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urbaniac-windows-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-msvc

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/urbaniac.exe"
          if (-not (Test-Path $exe)) {
            throw "Build succeeded but executable was not found: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  urbaniac.exe" | Set-Content "target/SHA256SUMS.txt" -Encoding ascii

      - name: Publish commit-specific GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: urbaniac-${{ github.sha }}
          name: Urbaniac build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          generate_release_notes: false
          files: |
            target/x86_64-pc-windows-msvc/release/urbaniac.exe
            target/SHA256SUMS.txt
          fail_on_unmatched_files: true
